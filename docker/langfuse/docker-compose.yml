# Self-hosted Langfuse for verifying research_os tracing. Isolated: own project name, own network, own volumes, UI on :3100 only.
# Usage: ./docker/langfuse/up.sh   (generates secrets into docker/langfuse/.env, which is gitignored)
name: researchos-langfuse
x-lf: &lf
  image: docker.langfuse.com/langfuse/langfuse-worker:4
  depends_on: {postgres: {condition: service_healthy}, clickhouse: {condition: service_healthy}, redis: {condition: service_healthy}, minio: {condition: service_healthy}}
  environment: &lf-env
    DATABASE_URL: postgresql://postgres:${PG_PASS}@postgres:5432/postgres
    SALT: ${SALT}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    TELEMETRY_ENABLED: "false"
    CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: clickhouse
    CLICKHOUSE_PASSWORD: ${CH_PASS}
    CLICKHOUSE_CLUSTER_ENABLED: "false"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_AUTH: ${REDIS_PASS}
    LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
    LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
    LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
    LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASS}
    LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
    LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
services:
  worker:
    <<: *lf
  web:
    <<: *lf
    image: docker.langfuse.com/langfuse/langfuse:4
    ports: ["127.0.0.1:3100:3000"]
    environment:
      <<: *lf-env
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: researchos
      LANGFUSE_INIT_ORG_NAME: researchos
      LANGFUSE_INIT_PROJECT_ID: researchos
      LANGFUSE_INIT_PROJECT_NAME: research-os
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET}
      LANGFUSE_INIT_USER_EMAIL: dev@research-os.local
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: ${LF_USER_PASS}
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    environment: {CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: "${CH_PASS}"}
    volumes: [ch_data:/var/lib/clickhouse]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"], interval: 5s, timeout: 5s, retries: 20}
  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: "${MINIO_PASS}"}
    volumes: [minio_data:/data]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASS}"]
    healthcheck: {test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"], interval: 5s, timeout: 5s, retries: 20}
  postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: "${PG_PASS}"}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 20}
volumes: {ch_data: {}, minio_data: {}, pg_data: {}}
