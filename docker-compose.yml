# One command runs the whole app:   docker compose up --build        then open  http://localhost:3201
#   - needs ./.env with GOOGLE_API_KEY and TAVILY_API_KEY (read at runtime, never copied into an image)
#   - needs the trained router in ./models/router (mounted read-only)
#   - ports: UI 3201, API 8010 (override with UI_PORT / API_PORT; ports 3000/8000 are often used by other projects)
# (The old Postgres test helper is still here:  docker compose --profile test up -d postgres)
name: research-os
services:
  api:
    build: .
    env_file: .env
    environment:
      RESEARCH_OS_TOOLS: live
      RESEARCH_OS_CORS_ORIGINS: http://localhost:${UI_PORT:-3201}
    ports: ["${API_PORT:-8010}:8000"]
    volumes:
      - ./models:/app/models:ro
      - runs:/app/runs                    # run history, reports, SQLite memory
    restart: unless-stopped
  ui:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8010}
    ports: ["${UI_PORT:-3201}:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    profiles: ["test"]
    image: postgres:16
    environment: {POSTGRES_USER: research, POSTGRES_PASSWORD: research, POSTGRES_DB: research_test}
    ports: ["55433:5432"]
volumes:
  runs: {}
